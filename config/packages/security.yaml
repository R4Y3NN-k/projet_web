security:

    role_hierarchy:
        ROLE_CLIENT:   ROLE_USER
        ROLE_PROVIDER: ROLE_USER

    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            
            # Standard form login (handles fallback actions)
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                # send users to a post-login route which will redirect based on role
                default_target_path: app_post_login
                always_use_default_target_path: false

            # PERFECT FIX: Dedicated check_path for your JavaScript popup login
            json_login:
                check_path: /api/login
                username_path: _username
                password_path: _password
                
            logout:
                path: app_logout

    # Note: Only the *first* matching rule is applied
    access_control:
        # - { path: ^/admin, roles: ROLE_ADMIN }
        # - { path: ^/profile, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10